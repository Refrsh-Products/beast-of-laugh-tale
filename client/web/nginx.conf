# Temporary: pre-load-test perf baseline. This file is included from inside
# the base image's `http {}` block, so a bare log_format here (outside any
# server block) lands in http context same as if declared there directly.
# Written to /var/log/perf/ (not /var/log/nginx/) on purpose — the default
# access.log/error.log in that directory are symlinked to stdout/stderr for
# Dozzle, and mounting a volume over the whole directory would shadow that.
log_format perf escape=json '{"time":"$time_iso8601","method":"$request_method",'
                             '"uri":"$uri","status":$status,'
                             '"request_time":$request_time}';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Temporary: pre-load-test perf baseline, additive alongside the default
    # access_log (multiple access_log directives in one context both fire).
    access_log /var/log/perf/access.log perf;

    # Allow larger uploads for notebook file ingestion.
    client_max_body_size 100M;

    # Docker's embedded DNS server. Required so nginx re-resolves `web` at
    # request time (via the `$upstream` variable in proxy_pass) instead of
    # caching the IP at startup. Without this, every web container recreate
    # causes 502s until the frontend is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript;

    # Proxy API traffic to the Django service. `web` is the compose service
    # name; Docker's embedded DNS resolves it on the shared network.
    location /api/ {
        set $upstream "http://web:8000";
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust the outer proxy (Caddy) — it sets this to "https". Falls back
        # to the request scheme when nothing's in front (local dev).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Chat message streaming needs unbuffered responses + long timeouts.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django admin panel + its static assets (served by WhiteNoise).
    location ~ ^/(admin|static)/ {
        set $upstream "http://web:8000";
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust the outer proxy (Caddy) — it sets this to "https". Falls back
        # to the request scheme when nothing's in front (local dev).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # React Router SPA fallback.
    # Any path that isn't a real file (e.g. /dashboard, /notebook/123)
    # is served index.html and React Router takes over client-side.
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so browsers always get the latest JS bundle hashes
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints every file in /assets with a content hash.
    # Safe to cache these permanently — a new build = a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}