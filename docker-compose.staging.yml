# Staging environment
# Run with: docker compose --env-file .env.staging -p freshr-staging -f docker-compose.staging.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GHCR_ORG}/freshr-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn freshr.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120"
    volumes:
      - media:/app/media
    ports:
      - "8001:8000"
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: ghcr.io/${GHCR_ORG}/freshr-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A freshr worker -l info --concurrency 1
    volumes:
      - media:/app/media
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/${GHCR_ORG}/freshr-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A freshr beat -l info
    volumes:
      - media:/app/media
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React SPA served by Nginx — staging build, always tagged :staging.
  # No host port: Caddy terminates TLS on 80/443 and reverse-proxies to this
  # container over the internal Docker network.
  frontend:
    image: ghcr.io/${GHCR_ORG}/freshr-web:staging
    restart: unless-stopped

  # Public entrypoint. Caddy auto-provisions a Let's Encrypt cert for
  # staging.freshr.cc on first boot (HTTP-01 challenge on :80).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    ports:
      - "8889:8080" # Maps internal 8080 to VPS port 8889

volumes:
  dozzle_data:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
