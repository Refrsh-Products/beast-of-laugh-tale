# Staging environment
# Run with: docker compose --env-file .env.staging -p freshr-staging -f docker-compose.staging.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # Tuned for a low-RAM host shared with another Postgres + Python stacks.
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c max_connections=50
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/${GHCR_ORG}/freshr-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn freshr.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120"
    mem_limit: 512m
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: ghcr.io/${GHCR_ORG}/freshr-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: celery -A freshr worker -l info --concurrency 1
    mem_limit: 512m
    volumes:
      - media:/app/media
    env_file:
      - .env.staging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # celery-beat removed — staging has no real users so subscription expiry doesn't
  # need to run here. If you ever need it for QA, run the task manually:
  #   docker exec freshr-staging-web-1 python manage.py shell -c "from accounts.tasks import expire_subscriptions; expire_subscriptions()"

  # React SPA served by Nginx — staging build, always tagged :staging.
  # No host port: the shared Caddy (docker-compose.caddy.yml) reaches this
  # container over the `edge` network via the `frontend-staging` alias.
  frontend:
    image: ghcr.io/${GHCR_ORG}/freshr-web:staging
    restart: unless-stopped
    mem_limit: 64m
    networks:
      default:
      edge:
        aliases:
          - frontend-staging

  # Log viewer for all containers on the host (staging AND prod, since it
  # reads /var/run/docker.sock). Not exposed to the host — Caddy reverse-proxies
  # logs.freshr.cc to this container over the `edge` network.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
      - /opt/freshr/dozzle/users.yml:/data/users.yml:ro
    networks:
      default:
      edge:
        aliases:
          - dozzle

networks:
  edge:
    external: true

volumes:
  dozzle_data:
  postgres_data:
  media:
