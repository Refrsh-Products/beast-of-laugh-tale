# Local environment
# Run with: docker compose --env-file .env.local -p freshr-local -f docker-compose.local.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: freshr
      POSTGRES_USER: freshr
      POSTGRES_PASSWORD: freshr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshr -d freshr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./server
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn freshr.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./server:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: freshr
      DB_USER: freshr
      DB_PASSWORD: freshr
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://freshr:freshr@postgres:5432/freshr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./server
    command: celery -A freshr worker -l info
    volumes:
      - ./server:/app
      - media:/app/media
      # Persists HF hub + unstructured model downloads across container restarts.
      # Without this, every ingestion re-downloads ~1.5 GB from Hugging Face.
      - hf_cache:/root/.cache
    env_file:
      - .env.local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: freshr
      DB_USER: freshr
      DB_PASSWORD: freshr
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://freshr:freshr@postgres:5432/freshr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data

  mkdocs:
    image: squidfunk/mkdocs-material
    volumes:
      - ./server:/docs
    ports:
      - "8001:8000"
    command: serve --dev-addr=0.0.0.0:8000

volumes:
  dozzle_data:
  postgres_data:
  media:
  hf_cache:
