name: CI

# Run these checks for pull requests into main, and allow other workflows to
# reuse the same checks with `uses: ./.github/workflows/ci.yml`.
on:
  pull_request:
    branches: [main]
  workflow_call:

# The test jobs only need permission to read the repository's code.
permissions:
  contents: read

jobs:
  # Backend and frontend jobs run independently, so GitHub can run them in
  # parallel. A failure in either job makes the overall CI check fail.
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL database with the PGVector extension for
    # Django integration tests. GitHub removes it after the job finishes.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: freshr
          POSTGRES_USER: freshr
          POSTGRES_PASSWORD: freshr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshr -d freshr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Download the pull request's code onto the GitHub-hosted runner.
      - uses: actions/checkout@v4

      # Install Python and cache downloaded packages to speed up later runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        working-directory: server
        run: python -m pip install -r requirements-dev.txt

      # Pytest automatically discovers and runs the backend test suite.
      - name: Run backend tests
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: freshr
          DB_USER: freshr
          DB_PASSWORD: freshr
        run: python -m pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      # Download the pull request's code onto a separate runner.
      - uses: actions/checkout@v4

      # Install Node.js and cache npm packages to speed up later runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # Run the web workspace's Vitest suite once, without watch mode.
      - name: Run frontend tests
        working-directory: client
        run: npm run test --workspace=@freshr/web -- --run

      # Compile the frontend to catch TypeScript or production-build errors.
      - name: Verify frontend build
        working-directory: client
        run: npm run build
