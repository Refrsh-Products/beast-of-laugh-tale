services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: freshr
      POSTGRES_USER: freshr
      POSTGRES_PASSWORD: freshr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshr -d freshr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./server
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./server:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: freshr
      DB_USER: freshr
      DB_PASSWORD: freshr
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://freshr:freshr@postgres:5432/freshr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./server
    command: celery -A freshr worker -l info
    volumes:
      - ./server:/app
      - media:/app/media
    env_file:
      - ./server/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: freshr
      DB_USER: freshr
      DB_PASSWORD: freshr
      REDIS_URL: redis://redis:6379/0
      CONNECTION_STRING: postgresql+psycopg://freshr:freshr@postgres:5432/freshr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media:
